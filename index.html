<style>
/* Layout: Regattabahn bei Nacht. Links eine feste Seitenleiste mit Marke und Navigation, rechts der Arbeitsbereich aus ruhigen Karten; die Übersicht öffnet mit einem Markenband. Schmal: Leiste wird zur Kopfzeile. */
:root{
  --bg:#07111F; --bg2:#0C1B33; --panel:#0F2038; --panel-hi:#15294A; --field:#0A1930; --line:#22406A; --hair:rgba(150,180,230,.13);
  --fg:#EAF1FA; --muted:#8FA3C2; --faint:#5F7598;
  --accent:#2EC4D6; --accent-ink:#04222A; --warn:#F5A742; --good:#4FD197; --bad:#F4677F; --blue:#6B9BFF;
  --shadow:0 1px 0 rgba(255,255,255,.045) inset,0 18px 40px -24px rgba(0,0,0,.75);
  --font:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --disp:"Barlow Condensed","Arial Narrow","Inter Variable",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EDF1F6; --bg2:#E2E9F2; --panel:#FFFFFF; --panel-hi:#FFFFFF; --field:#F4F7FB; --line:#C6D2E2; --hair:rgba(20,50,100,.11);
  --fg:#0B1C33; --muted:#52668A; --faint:#8191AD;
  --accent:#0A8499; --accent-ink:#FFFFFF; --warn:#B26200; --good:#16794D; --bad:#C22F4B; --blue:#2C5BD0;
  --shadow:0 1px 2px rgba(15,40,80,.06),0 14px 32px -22px rgba(15,40,80,.35); color-scheme:light }
@media print{ :root[data-theme]{--bg:#fff;--bg2:#fff;--panel:#fff;--panel-hi:#fff;--field:#fff;--line:#9aa5b4;--hair:#c9d0da;--fg:#000;--muted:#3c4656;--faint:#666;--accent:#0A8499;--accent-ink:#fff;--warn:#9a5a00;--shadow:none;color-scheme:light}
  .side,.noprint,#toast{display:none!important} .app{display:block} .main{padding:0!important} body{background:#fff!important} .sheet{border:0!important;padding:0!important;box-shadow:none!important;background:#fff!important} .sheet table{break-inside:avoid} }
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;margin:0;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 620px at 108% -12%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 62%),radial-gradient(900px 600px at -12% 112%,color-mix(in srgb,var(--blue) 13%,transparent),transparent 60%),linear-gradient(160deg,var(--bg),var(--bg2)) var(--bg)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
/* Seitenleiste */
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px 16px;border-right:1px solid var(--hair);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 82%,transparent),color-mix(in srgb,var(--bg) 70%,transparent));overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:12px;padding:2px 6px 16px}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(150deg,var(--panel-hi),var(--field));border:1px solid var(--hair);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:var(--shadow)}
.logo img{width:100%;height:100%;object-fit:contain} .logo svg{width:100%;height:100%}
.brand{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.09em;line-height:1;min-width:0}
